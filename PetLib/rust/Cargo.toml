[package]
name = "petlib"
version = "0.1.0"
edition = "2021"

[lib]
name = "petlib"
crate-type = ["cdylib", "rlib"]

[dependencies]
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# 保持 unwind（默认值）：JNI 入口用 catch_unwind 兜底，
# 渲染线程恐慌不能直接杀死整个启动器进程。

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
